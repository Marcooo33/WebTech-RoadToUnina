<nav class="nav" aria-label="Navigazione principale" (focusout)="onFocusOut($event)">
  <div class="nav__inner container">
    <a #brand class="nav__brand" routerLink="/" (click)="closeMenu()" aria-label="ROADTOUNINA">
      <img class="nav__mark" src="logo.svg" width="28" height="28" alt="" aria-hidden="true" />
      <span>ROAD<span>TO</span>UNINA</span>
    </a>

    <button
      #menuToggle
      type="button"
      class="nav__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      aria-label="Apri o chiudi il menu di navigazione"
      (click)="toggleMenu()"
    >
      <ng-icon class="icon" [name]="menuOpen() ? 'lucideX' : 'lucideMenu'" aria-hidden="true" />
    </button>

    <div id="primary-navigation" class="nav__links" [class.nav__links--open]="menuOpen()">
      <div class="nav__primary">
        @if (isAuthenticated()) {
          <a
            routerLink="/"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            ><ng-icon class="icon" name="lucideHouse" aria-hidden="true" />Dashboard</a
          >
        } @else {
          <a
            routerLink="/"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            ><ng-icon class="icon" name="lucideHouse" aria-hidden="true" />Homepage</a
          >
        }
        <a
          routerLink="/history"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        >
          <ng-icon class="icon" name="lucideHistory" aria-hidden="true" />Classifica
        </a>
      </div>

      <div class="nav__account">
        @if (isAuthenticated()) {
          <a
            routerLink="/profile"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            <ng-icon class="icon" name="lucideUserRound" aria-hidden="true" />Profilo
          </a>
          <span class="nav__user" [title]="user()?.username ?? ''">{{ user()?.username }}</span>
          <button type="button" class="nav__logout" (click)="logout()">
            <ng-icon class="icon" name="lucideLogOut" aria-hidden="true" />Esci
          </button>
        } @else {
          <a routerLink="/" [queryParams]="{ guest: 'start' }" (click)="closeMenu()"
            >Gioca come ospite</a
          >
          <a
            routerLink="/login"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            <ng-icon class="icon" name="lucideLogIn" aria-hidden="true" />Accedi
          </a>
          <a
            class="nav__register"
            routerLink="/register"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            <ng-icon class="icon" name="lucideUserRoundPlus" aria-hidden="true" />Registrati
          </a>
        }
      </div>
    </div>
  </div>
</nav>
