<nav class="nav">
  <div class="nav__inner container">
    <a class="nav__brand" routerLink="/" (click)="closeMenu()">ROADTOUNINA</a>

    <button
      type="button"
      class="nav__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="nav__links" [class.nav__links--open]="menuOpen()">
      @if (isAuthenticated()) {
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Dashboard</a
        >
      } @else {
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Home</a
        >
      }
      <a routerLink="/history" routerLinkActive="active" (click)="closeMenu()">History</a>

      @if (isAuthenticated()) {
        <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">Profile</a>
        <span class="nav__user">{{ user()?.username }}</span>
        <button type="button" class="nav__logout" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Log in</a>
        <a routerLink="/register" routerLinkActive="active" (click)="closeMenu()">Register</a>
      }
    </div>
  </div>
</nav>
